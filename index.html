<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/styles.css">
    <title>Life in weeks</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Your life in weeks</h1>
            <p>Enter date of birth</p>
        </div>
        <form onsubmit="calculateWeeks(event)">
            <div>
                <select id="month">
                    <option value="1" selected>January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>
            <div>
                <input id="date" name="date" placeholder="Day" required>
            </div>
            <div>
                <input id="year" name="year" placeholder="Year" required>
            </div>
            <button type="submit">Calculate</button>
        </form>
        <div id="result"></div>
        <footer class="footer hidden">
            <p>Based on the Your Life in Weeks post by Tim Urban, from Wait But Why.</p>
        </footer>
    </div>



    <script src="./scripts/calculate.js"></script>
</body>

</html>
